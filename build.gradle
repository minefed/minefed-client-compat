plugins {
    id 'java'
}

group = 'team.minefed.mods'
version = project.mod_version

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

sourceSets {
    // Compile-only signatures of pinned production (intermediary and PFM 1.5.0) classes.
    // They are never packaged; probes check them against the official PFM bytecode.
    stubs
    probe
}

dependencies {
    // Fabric Loader supplies Mixin at runtime. Do not bundle it or any PTS code.
    compileOnly('net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7') {
        transitive = false
    }
    // Fabric Loader 0.18.4 bundles MixinExtras 0.5.0; do not bundle another copy.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    compileOnly sourceSets.stubs.output
    // Minecraft supplies SLF4J at runtime
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    compileOnly 'org.joml:joml:1.10.5'
    stubsCompileOnly 'org.joml:joml:1.10.5'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.google.guava:guava:32.1.2-jre'
    stubsCompileOnly 'com.google.guava:guava:32.1.2-jre'
    // Test-only dependencies: never included in the runtime mod JAR.
    probeImplementation 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
    probeImplementation 'io.github.llamalad7:mixinextras-common:0.5.0'
    // The official PFM cache calls JsonArray.add(String), unavailable in Mixin's older Gson.
    probeImplementation 'com.google.code.gson:gson:2.10.1'
    probeImplementation 'org.joml:joml:1.10.5'
    probeImplementation 'com.google.guava:guava:32.1.2-jre'
    // AtlasSpriteProbe calls the pure sprite rules directly; the JAR supplies them at runtime
    probeCompileOnly sourceSets.main.output
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    // All selectors use pinned production names; no Minecraft mappings are needed.
    options.compilerArgs += ['-proc:none']
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    from('LICENSE')
}

tasks.named('sourcesJar') {
    from('LICENSE')
}

def ptsJarPath = providers.gradleProperty('ptsJar')
def probeOutput = layout.buildDirectory.dir('recipe-probe')

tasks.register('probeRecipeBoundary', JavaExec) {
    group = 'verification'
    description = 'Reproduces the PTS 4.0.0 overread using its original reader/writer bytecode.'
    dependsOn tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath
    mainClass = 'PtsRecipeBoundaryProbe'
    doFirst {
        if (!ptsJarPath.isPresent()) {
            throw new GradleException('Supply the official PTS-Deco 4.0.0 JAR using -PptsJar=/path/to/PTS-Deco-4.0.0-Fabric1.20.4.jar')
        }
        args = [file(ptsJarPath.get()).absolutePath, probeOutput.get().asFile.absolutePath]
    }
}

tasks.register('verifyPtsCompatibility', JavaExec) {
    group = 'verification'
    description = 'Applies the shipped Mixin and verifies the resulting PTS recipe packet boundaries.'
    dependsOn tasks.named('jar'), tasks.named('probeRecipeBoundary')
    classpath = sourceSets.probe.runtimeClasspath +
        files(tasks.named('jar').flatMap { it.archiveFile }) +
        files(probeOutput.map { it.dir('original-probe-classes') })
    mainClass = 'MixinCompatProbe'
    doFirst {
        args = [
            probeOutput.get().dir('original-probe-classes').asFile.absolutePath,
            probeOutput.get().dir('mixin-probe-classes').asFile.absolutePath,
            'minefed-client-compat.mixins.json',
            file(ptsJarPath.get()).absolutePath
        ]
    }
}

def pfmJarPath = providers.gradleProperty('pfmJar')
tasks.register('verifyPfmPerformance', JavaExec) {
    group = 'verification'
    description = 'Applies the shipped PFM performance Mixins to the official PFM bytecode and compares original and patched ticks.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'PfmPerformanceProbe'
    doFirst {
        if (!pfmJarPath.isPresent()) {
            throw new GradleException('Supply the official PFM 1.5.0 Fabric 1.20.4 JAR using -PpfmJar=/path/to/paladin-furniture-mod-1.5.0-fabric-mc1.20.4.jar')
        }
        args = [file(pfmJarPath.get()).absolutePath, layout.buildDirectory.dir('pfm-performance-probe').get().asFile.absolutePath]
    }
}

tasks.register('verifyPfmCache', JavaExec) {
    group = 'verification'
    description = 'Applies the cache Mixins to official PFM bytecode and checks streamed fingerprints and legacy cache migration.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'PfmCacheProbe'
    doFirst {
        if (!pfmJarPath.isPresent()) throw new GradleException('Supply the official PFM JAR using -PpfmJar=/path/to/paladin-furniture-mod-1.5.0-fabric-mc1.20.4.jar')
        args = [file(pfmJarPath.get()).absolutePath, layout.buildDirectory.dir('pfm-cache-probe').get().asFile.absolutePath]
        if (providers.gradleProperty('pfmCacheDir').isPresent()) args += [file(providers.gradleProperty('pfmCacheDir').get()).absolutePath]
    }
}

def trafficcraftJarPath = providers.gradleProperty('trafficcraftJar')
tasks.register('verifyTrafficCraftPerformance', JavaExec) {
    group = 'verification'
    description = 'Applies the shipped TrafficCraft performance Mixins to the official TrafficCraft bytecode and compares original and patched code.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'TrafficCraftPerformanceProbe'
    doFirst {
        if (!trafficcraftJarPath.isPresent()) {
            throw new GradleException('Supply the official TrafficCraft 1.20.4-1.1.3 Fabric JAR using -PtrafficcraftJar=/path/to/trafficcraft-fabric-1.20.4-1.1.3.jar')
        }
        args = [file(trafficcraftJarPath.get()).absolutePath, layout.buildDirectory.dir('trafficcraft-performance-probe').get().asFile.absolutePath]
    }
}

tasks.register('verifyPfmCompatibility', JavaExec) {
    group = 'verification'
    description = 'Reproduces PFM first-frame deferral and checks the shipped Mixin with the official queue bytecode.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses'), tasks.named('verifyPfmPerformance')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'PfmTextureBoundaryProbe'
    doFirst {
        if (!pfmJarPath.isPresent()) {
            throw new GradleException('Supply the official PFM 1.5.0 Fabric 1.20.4 JAR using -PpfmJar=/path/to/paladin-furniture-mod-1.5.0-fabric-mc1.20.4.jar')
        }
        args = [file(pfmJarPath.get()).absolutePath, layout.buildDirectory.dir('pfm-probe').get().asFile.absolutePath]
    }
}

def atlasModsDir = providers.gradleProperty('atlasModsDir')
def minecraftJarPath = providers.gradleProperty('minecraftJar').orElse(
    new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/1.20.4/minecraft-merged-intermediary.jar').absolutePath)
def scenaJarPath = providers.gradleProperty('scenaJar').orElse(providers.provider {
    def fixtures = fileTree(new File(gradle.gradleUserHomeDir,
        'caches/modules-2/files-2.1/com.communi-suggestu.scena/scena-fabric/1.0.141')) {
        include '**/scena-fabric-1.0.141.jar'
    }.files
    if (fixtures.size() != 1) throw new GradleException('Supply the official Scena 1.0.141 JAR using -PscenaJar=/path/to/scena-fabric-1.0.141.jar')
    fixtures.first().absolutePath
})
tasks.register('verifyScenaModelCache', JavaExec) {
    group = 'verification'
    description = 'Checks repeated loader-absent parsing against pinned official Scena bytecode.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'ScenaModelCacheProbe'
    maxHeapSize = '512m'
    doFirst {
        if (!scenaJarPath.isPresent()) throw new GradleException('Supply the official Scena 1.0.141 JAR using -PscenaJar=/path/to/scena-fabric-1.0.141.jar')
        args = [file(scenaJarPath.get()).absolutePath, layout.buildDirectory.dir('scena-model-cache-probe').get().asFile.absolutePath]
        if (providers.gradleProperty('scenaModelCorpusDir').isPresent()) args += [file(providers.gradleProperty('scenaModelCorpusDir').get()).absolutePath]
    }
}

tasks.register('verifyModelVariantIndex', JavaExec) {
    group = 'verification'
    description = 'Checks indexed variant selection against the original ordered predicate scan.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'ModelVariantIndexProbe'
    maxHeapSize = '512m'
}

tasks.register('verifyModelVariantMixin', JavaExec) {
    group = 'verification'
    description = 'Checks variant predicate capture and filter injection in pinned Minecraft bytecode.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'ModelVariantMixinProbe'
    maxHeapSize = '512m'
    doFirst {
        if (!minecraftJarPath.isPresent()) throw new GradleException('Supply the pinned Minecraft 1.20.4 intermediary JAR using -PminecraftJar=/path/to/minecraft-merged-intermediary.jar')
        args = [file(minecraftJarPath.get()).absolutePath, layout.buildDirectory.dir('model-variant-probe').get().asFile.absolutePath]
    }
}

tasks.register('verifyModelRotation', JavaExec) {
    group = 'verification'
    description = 'Compares pinned vanilla and transformed model rotation bytecode bit for bit.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'ModelRotationProbe'
    maxHeapSize = '512m'
    doFirst {
        if (!minecraftJarPath.isPresent()) throw new GradleException('Supply the pinned Minecraft 1.20.4 intermediary JAR using -PminecraftJar=/path/to/minecraft-merged-intermediary.jar')
        args = [file(minecraftJarPath.get()).absolutePath, layout.buildDirectory.dir('model-rotation-probe').get().asFile.absolutePath]
    }
}

tasks.register('verifyAtlasSprites', JavaExec) {
    group = 'verification'
    description = 'Checks the block atlas sprite rules on synthetic images and, with -PatlasModsDir, on every block atlas texture of the given mod JARs.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'AtlasSpriteProbe'
    maxHeapSize = '2g'
    doFirst {
        if (providers.gradleProperty('atlasDump').isPresent()) {
            systemProperty 'atlas.dump', file(providers.gradleProperty('atlasDump').get()).absolutePath
        }
        if (atlasModsDir.isPresent()) {
            args = [file(atlasModsDir.get()).absolutePath]
        }
    }
}
