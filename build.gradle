plugins {
    id 'java'
}

group = 'team.minefed.mods'
version = project.mod_version

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

sourceSets {
    // Compile-only signatures of pinned production (intermediary and PFM 1.5.0) classes.
    // They are never packaged; probes check them against the official PFM bytecode.
    stubs
    probe
}

dependencies {
    // Fabric Loader supplies Mixin at runtime. Do not bundle it or any PTS code.
    compileOnly('net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7') {
        transitive = false
    }
    // Fabric Loader 0.18.4 bundles MixinExtras 0.5.0; do not bundle another copy.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    compileOnly sourceSets.stubs.output
    // Test-only dependencies: never included in the runtime mod JAR.
    probeImplementation 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
    probeImplementation 'io.github.llamalad7:mixinextras-common:0.5.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    // All selectors use pinned production names; no Minecraft mappings are needed.
    options.compilerArgs += ['-proc:none']
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    from('LICENSE')
}

tasks.named('sourcesJar') {
    from('LICENSE')
}

def ptsJarPath = providers.gradleProperty('ptsJar')
def probeOutput = layout.buildDirectory.dir('recipe-probe')

tasks.register('probeRecipeBoundary', JavaExec) {
    group = 'verification'
    description = 'Reproduces the PTS 4.0.0 overread using its original reader/writer bytecode.'
    dependsOn tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath
    mainClass = 'PtsRecipeBoundaryProbe'
    doFirst {
        if (!ptsJarPath.isPresent()) {
            throw new GradleException('Supply the official PTS-Deco 4.0.0 JAR using -PptsJar=/path/to/PTS-Deco-4.0.0-Fabric1.20.4.jar')
        }
        args = [file(ptsJarPath.get()).absolutePath, probeOutput.get().asFile.absolutePath]
    }
}

tasks.register('verifyPtsCompatibility', JavaExec) {
    group = 'verification'
    description = 'Applies the shipped Mixin and verifies the resulting PTS recipe packet boundaries.'
    dependsOn tasks.named('jar'), tasks.named('probeRecipeBoundary')
    classpath = sourceSets.probe.runtimeClasspath +
        files(tasks.named('jar').flatMap { it.archiveFile }) +
        files(probeOutput.map { it.dir('original-probe-classes') })
    mainClass = 'MixinCompatProbe'
    doFirst {
        args = [
            probeOutput.get().dir('original-probe-classes').asFile.absolutePath,
            probeOutput.get().dir('mixin-probe-classes').asFile.absolutePath,
            'minefed-client-compat.mixins.json',
            file(ptsJarPath.get()).absolutePath
        ]
    }
}

def pfmJarPath = providers.gradleProperty('pfmJar')
tasks.register('verifyPfmPerformance', JavaExec) {
    group = 'verification'
    description = 'Applies the shipped PFM performance Mixins to the official PFM bytecode and compares original and patched ticks.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'PfmPerformanceProbe'
    doFirst {
        if (!pfmJarPath.isPresent()) {
            throw new GradleException('Supply the official PFM 1.5.0 Fabric 1.20.4 JAR using -PpfmJar=/path/to/paladin-furniture-mod-1.5.0-fabric-mc1.20.4.jar')
        }
        args = [file(pfmJarPath.get()).absolutePath, layout.buildDirectory.dir('pfm-performance-probe').get().asFile.absolutePath]
    }
}

def trafficcraftJarPath = providers.gradleProperty('trafficcraftJar')
tasks.register('verifyTrafficCraftPerformance', JavaExec) {
    group = 'verification'
    description = 'Applies the shipped TrafficCraft performance Mixins to the official TrafficCraft bytecode and compares original and patched code.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'TrafficCraftPerformanceProbe'
    doFirst {
        if (!trafficcraftJarPath.isPresent()) {
            throw new GradleException('Supply the official TrafficCraft 1.20.4-1.1.3 Fabric JAR using -PtrafficcraftJar=/path/to/trafficcraft-fabric-1.20.4-1.1.3.jar')
        }
        args = [file(trafficcraftJarPath.get()).absolutePath, layout.buildDirectory.dir('trafficcraft-performance-probe').get().asFile.absolutePath]
    }
}

tasks.register('verifyPfmCompatibility', JavaExec) {
    group = 'verification'
    description = 'Reproduces PFM first-frame deferral and checks the shipped Mixin with the official queue bytecode.'
    dependsOn tasks.named('jar'), tasks.named('probeClasses'), tasks.named('verifyPfmPerformance')
    classpath = sourceSets.probe.runtimeClasspath + files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'PfmTextureBoundaryProbe'
    doFirst {
        if (!pfmJarPath.isPresent()) {
            throw new GradleException('Supply the official PFM 1.5.0 Fabric 1.20.4 JAR using -PpfmJar=/path/to/paladin-furniture-mod-1.5.0-fabric-mc1.20.4.jar')
        }
        args = [file(pfmJarPath.get()).absolutePath, layout.buildDirectory.dir('pfm-probe').get().asFile.absolutePath]
    }
}
